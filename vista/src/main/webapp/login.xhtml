<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

<h:head>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/3.1.1/css/bootstrap.min.css" rel="stylesheet" type="text/css"/>
    <link href="style.css" rel="stylesheet" type="text/css"/>
    <style>
        body { background-color: #131314; color: #ffffff; }
        *{ text-align: center; }
        .center{ float: none; margin: 0 auto; }
        div.login{
            position: absolute; top:0; bottom: 0; left: 0; right: 0;
            height: 420px; width: 25%; min-width: 300px; padding: 25px; margin: auto;
            background: #1e1e1e; border-radius: 5px;
            box-shadow: 0 4px 8px 0 rgba(0, 0, 0, 0.5), 0 6px 20px 0 rgba(0, 0, 0, 0.4);
        }
        .logo-esquina { position: absolute; top: 20px; right: 25px; width: 150px; }
        .img-user { width: 80px; margin-bottom: 20px; }
        .form-control { background-color: #2b2b2b; color: white; border: 1px solid #444; }
        .form-control:focus{ border-color:#007738; background-color: #333; color: white; }
        .btn-success { background-color: #007738 !important; border-color: #005528 !important; text-shadow: none; margin-top: 10px; }
        .btn-success:hover { background-color: #005528 !important; }
    </style>
</h:head>

<h:body>
    <p:graphicImage url="resources/uabcl.png" class="logo-esquina" />
    <div class="row">
        <h:form>
            <p:messages id="messages" showDetail="true" closable="true" />
            <div class="login">
                <div class="panel-header">
                    <h4 style="margin-bottom: 15px;">Iniciar Sesion</h4>
                    <p:graphicImage url="resources/user.png" class="img-user" />
                </div>
                <div class="panel-body">
                    <div class="form-group">
                        <p:inputText class="form-control" placeholder="Usuario:" autocomplete="false" value="#{loginUI.usuario.username}" />
                    </div>
                    <div class="form-group">
                        <p:password class="form-control" placeholder="Clave: " value="#{loginUI.usuario.password}" />
                    </div>
                    <p:commandButton class="btn btn-success" value="Ingresar" action="#{loginUI.login()}" ajax="false" />
                </div>
            </div>
        </h:form>
    </div>
</h:body>
</html>
